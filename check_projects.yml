name: Check Dnipro council draft projects

on:
  schedule:
    # Кожні 3 години (UTC). GitHub може запускати cron із затримкою
    # кілька-десять хвилин у пікові періоди — це нормально для такої задачі.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}
    # Дозволяє запустити вручну з вкладки Actions -> Run workflow,
    # корисно для першого тестового запуску.

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        # Токен уже вписаний прямо у scraper.py, тому змінні середовища тут
        # не обов'язкові. Якщо пізніше захочете перенести токен/chat_id у
        # GitHub Secrets (Settings -> Secrets and variables -> Actions),
        # розкоментуйте блок нижче — значення з secrets матимуть пріоритет.
        # env:
        #   TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        #   TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Commit updated state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_projects.json
          git diff --quiet --cached || git commit -m "chore: update seen projects state [skip ci]"
          git push
